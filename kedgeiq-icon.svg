<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="sailTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7ee8ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="sailLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1d4ed8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Main tall sail -->
  <polygon points="52,8 52,62 30,62" fill="url(#sailTop)"/>
  <!-- Right small sail -->
  <polygon points="54,18 54,55 72,48" fill="url(#sailTop)" opacity="0.85"/>
  <!-- Hull base -->
  <polygon points="22,65 78,65 70,78 30,78" fill="url(#hullGrad)"/>
  <!-- Wave lines -->
  <path d="M24,68 Q37,64 50,68 Q63,72 76,68" fill="none" stroke="#7ee8ff" stroke-width="1.5" opacity="0.7"/>
  <path d="M27,72 Q40,69 50,72 Q62,75 73,72" fill="none" stroke="#7ee8ff" stroke-width="1.2" opacity="0.5"/>
  <!-- Mast -->
  <line x1="52" y1="8" x2="52" y2="65" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round"/>
</svg>
