<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="sail-main" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#7ee8ff"/>
      <stop offset="50%" stop-color="#1a8fe8"/>
      <stop offset="100%" stop-color="#0a3fa8"/>
    </linearGradient>
    <linearGradient id="sail-fore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5dd4f8"/>
      <stop offset="100%" stop-color="#1060c8"/>
    </linearGradient>
    <linearGradient id="hull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a6edc"/>
      <stop offset="100%" stop-color="#08297a"/>
    </linearGradient>
  </defs>

  <!-- Main sail (large, pointing up-left) -->
  <polygon points="18,75 22,18 62,75" fill="url(#sail-main)"/>

  <!-- Fore sail (smaller, right side) -->
  <polygon points="64,75 72,32 86,75" fill="url(#sail-fore)" opacity="0.9"/>

  <!-- Hull / water lines -->
  <path d="M14,78 Q38,85 62,78 Q74,74 88,78" stroke="url(#hull)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M18,84 Q40,90 64,84 Q74,80 86,84" stroke="#1a6edc" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M22,89 Q42,94 66,89 Q75,86 84,89" stroke="#0a3fa8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
</svg>
